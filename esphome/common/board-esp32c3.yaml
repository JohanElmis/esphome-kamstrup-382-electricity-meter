# Board package: ESP32-C3 Super Mini.
# Include this from a node file for meters on a C3 Super Mini.
#
# Flashing uses the native USB Serial/JTAG. The meter UART is on GPIO5/6, not
# the UART0 pins (GPIO20/21): the boot ROM prints on GPIO21 at power-up, which
# would go into the meter's Data in. GPIO4 is a safe input; the strapping pins
# 2/8/9 are avoided.

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
  variant: ESP32C3

substitutions:
  uart_rx_pin: GPIO5  # meter pin 2 "Data out" -> ESP RX
  uart_tx_pin: GPIO6  # meter pin 5 "Data in"  <- ESP TX
  pulse_pin: GPIO4 # meter pin 3 "Pulse out" (1000 imp/kWh)
